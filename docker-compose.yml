
services:

  sql-server-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sql-server-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD}"
      MSSQL_PID: "Developer"
      MSSQL_MEMORY_LIMIT_MB: "2048"
    volumes:
      - sql_data:/var/opt/mssql
    networks:
      - glms-network
    restart: unless-stopped

  glms-backend-api:
    build:
      context: .
      dockerfile: GLMS.Api/Dockerfile
    container_name: glms-backend-api
    ports:
      - "8081:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"

      # SQL Server
      ConnectionStrings__GlmsDb: "Server=sql-server-db,1433;Database=GlmsDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;"

      # JWT Authentication
      Jwt__Issuer: "GLMS.Api"
      Jwt__Audience: "GLMS.Web"
      Jwt__Key: "${JWT_KEY:?JWT_KEY must be configured}"

      # Administrator Credentials
      Admin__Username: "${ADMIN_USERNAME:?ADMIN_USERNAME must be configured}"
      Admin__PasswordHash: "${ADMIN_PASSWORD_HASH:?ADMIN_PASSWORD_HASH must be configured}"

    depends_on:
      - sql-server-db
    volumes:
      - agreements:/app/App_Data/SignedAgreements
    networks:
      - glms-network

  glms-frontend-web:
    build:
      context: .
      dockerfile: GLMS.Web/Dockerfile
    container_name: glms-frontend-web
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"

      # Backend API connection
      ApiSettings__BaseUrl: "http://glms-backend-api:8080/"

      # Existing database configuration
      ConnectionStrings__GlmsDb: "Server=sql-server-db,1433;Database=GlmsDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;"

    depends_on:
      - glms-backend-api
    networks:
      - glms-network

volumes:
  sql_data:
  agreements:

networks:
  glms-network:
    driver: bridge
